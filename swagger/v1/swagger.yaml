  parameters:
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
      description: Required. A retry with the same key and the same body returns the
        original result; the same key with a different body gets 422.
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description: Optional but recommended. A retry with the same key and the same
        body returns the original record instead of creating another; the same key
        with a different body gets 422.
    StripeSignature:
      name: Stripe-Signature
      in: header
      required: true
      schema:
        type: string
      description: Set by Stripe. Verified against STRIPE_WEBHOOK_SECRET.
